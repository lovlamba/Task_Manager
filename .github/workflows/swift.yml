# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches:
      - main
       
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: 'DEV'
    steps:
      - uses: actions/checkout@v6

      - name: Install xcpretty
        run: gem install xcpretty

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Set up Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer

      - name: Show current version of Xcode
        run: xcodebuild -version

      - name: Run tests
        run: |
          set -o pipefail
          SCHEME='ExpressRegTests'
          DESTINATION='platform=iOS Simulator,OS=26.4,name=iPad (A16),arch=arm64'
          xcodebuild test -scheme $SCHEME -sdk iphonesimulator -destination "$DESTINATION" -skip-testing ExpressRegUITests | xcpretty

